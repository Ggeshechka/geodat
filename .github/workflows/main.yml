name: "DEBUG - Minimal Check"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: "Test 1: Basic echo"
        run: echo "YAML syntax OK"

      - name: "Test 2: Clone geoip"
        run: |
          git clone --depth=1 https://github.com/Loyalsoldier/geoip geoip-src
          ls -la geoip-src

      - name: "Test 3: Geoip help"
        run: |
          cd geoip-src
          go run ./ --help || echo "Help failed"

      - name: "Test 4: Clone dlc"
        run: |
          git clone --depth=1 https://github.com/Loyalsoldier/domain-list-custom dlc-src
          ls -la dlc-src

      - name: "Test 5: Dlc help"
        run: |
          cd dlc-src
          go run ./ --help || echo "Help failed"

      - name: "Test 6: Simple geosite build"
        run: |
          cd dlc-src
          mkdir -p test-data
          echo "full:localhost" > test-data/private
          echo "domain:test.ru" > test-data/category-ru
          go run ./ --datapath=./test-data -datname=test.dat 2>&1 || echo "Build failed"
          ls -la publish/ 2>/dev/null || echo "No publish dir"
