name: Build Custom V2Ray rules (Loyalsoldier Edition)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.22'

      - name: Build geoip.dat via Loyalsoldier/geoip
        run: |
          mkdir -p publish geoip_data
          # Скачиваем только RU. Локальные адреса (private) утилита Loyalsoldier генерирует сама.
          curl -sSL https://raw.githubusercontent.com/v2fly/geoip/release/text/ru.txt > geoip_data/ru.txt
          
          git clone https://github.com/Loyalsoldier/geoip.git geoip-builder
          cd geoip-builder
          
          cat <<EOF > config.json
          {
            "input": [
              {"type": "text", "action": "add", "args": {"name": "ru", "uri": "../geoip_data/ru.txt"}},
              {"type": "private", "action": "add", "args": {"name": "private"}}
            ],
            "output": [
              {"type": "v2rayGeoIPDat", "action": "output", "args": {"outputDir": "../publish", "outputName": "geoip.dat"}}
            ]
          }
          EOF
          # Используем команду convert, как указано в документации Loyalsoldier
          go run ./ convert -c config.json
          cd ..

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Checkout Loyalsoldier/domain-list-custom
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/domain-list-custom
          path: custom

      - name: Build geosite.dat via Loyalsoldier/domain-list-custom
        run: |
          cd custom
          # Собираем базу с фильтрами Loyalsoldier, но только нужные категории
          go run ./ --datapath=../community/data --exportlists=category-ru,category-ads-all,private
          # Эта утилита всегда кладет результат в папку publish внутри себя
          mv ./publish/geosite.dat ../publish/geosite.dat
          cd ..

      - name: Generate hashes
        run: |
          cd publish
          sha256sum geoip.dat > geoip.dat.sha256sum
          sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Release and upload assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to "release" branch
        run: |
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Purge jsdelivr CDN
        run: |
          cd publish
          for file in $(ls); do
            curl -s -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}" > /dev/null
          done
